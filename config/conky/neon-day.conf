-- Neon-Grid: large day/date display (bottom-left of the laptop screen)
conky.config = {
    alignment = 'bottom_left',
    xinerama_head = 0,
    gap_x = 44,
    gap_y = 84,
    minimum_width = 1250,
    background = false,
    update_interval = 30,
    double_buffer = true,

    own_window = true,
    own_window_class = 'Conky',
    own_window_title = 'neon-day',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#00000000',

    border_inner_margin = 20,
    draw_borders = false,
    draw_shades = true,
    default_shade_color = 'ff2bd6',
    draw_outline = false,
    default_color = 'd6f6ff',
    color1 = '00f0ff',
    color2 = 'ff2bd6',
    color3 = 'd6f6ff',

    use_xft = true,
    font = 'Orbitron:size=12',
    override_utf8_locale = true,
    uppercase = true,

    lua_load = '~/.config/conky/neon-day.lua',
    lua_draw_hook_pre = 'day',
}

conky.text = [[
${font Orbitron:size=11}${color2}// ${time week %V}  /  day ${time %j}${font}
${font Orbitron:black:size=64}${color1}${time %A}${font}
${voffset 10}${font Orbitron:size=17}${color3}${time %d %B %Y}${font}
]]
