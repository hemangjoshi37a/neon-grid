-- Neon-Grid HUD (cyberpunk system monitor with ring gauges)
conky.config = {
    alignment = 'top_right',
    xinerama_head = 0,
    gap_x = 28,
    gap_y = 36,
    minimum_width = 300,
    maximum_width = 300,
    background = false,
    update_interval = 2,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    own_window = true,
    own_window_class = 'Conky',
    own_window_title = 'neon-hud',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#b4080a14',

    border_inner_margin = 20,
    border_width = 0,
    draw_borders = false,
    draw_graph_borders = false,
    draw_shades = false,
    draw_outline = false,
    default_color = 'd6f6ff',
    color1 = '00f0ff',
    color2 = 'ff2bd6',
    color3 = '7a86a8',
    color4 = 'f9f871',
    color5 = '29ffa3',

    use_xft = true,
    font = 'JetBrains Mono:size=9',
    override_utf8_locale = true,
    uppercase = false,

    lua_load = '~/.config/conky/neon-rings.lua',
    lua_draw_hook_pre = 'main',
}

conky.text = [[
${font Orbitron:bold:size=34}${color1}${time %H:%M}${font Orbitron:size=12}${color2} ${time %S}${font}${color}
${font Orbitron:size=10}${color2}${time %A  %d %B %Y}${font}${color}
${color3}${hr 1}${color}
${voffset 262}
${color3}${hr 1}${color}
${font Orbitron:bold:size=9}${color1}PROCESSES${font}${color}${alignr}${color3}up ${uptime_short}${color}
${color3}${top name 1}${alignr}${color}${top cpu 1}%
${color3}${top name 2}${alignr}${color}${top cpu 2}%
${color3}${top name 3}${alignr}${color}${top cpu 3}%
${color2}${cpugraph cpu0 30,300 00f0ff ff2bd6 -t}${color}
${font Orbitron:bold:size=9}${color1}MEMORY${font}${color}${alignr}${mem} / ${memmax}
${color3}${top_mem name 1}${alignr}${color}${top_mem mem_res 1}
${color3}${top_mem name 2}${alignr}${color}${top_mem mem_res 2}

${font Orbitron:bold:size=9}${color1}STORAGE${font}${color}${alignr}${color2}${fs_used_perc /}%${color}  ${fs_free /} free
${color1}${fs_bar 5,300 /}${color}

${font Orbitron:bold:size=9}${color1}NETWORK${font}${color}${alignr}${color3}@IFACE@${color}
${color3}down ${color}${downspeed @IFACE@}${alignr}${color3}up ${color}${upspeed @IFACE@}
${color1}${downspeedgraph @IFACE@ 26,146 00f0ff 00f0ff -t}${color} ${color2}${upspeedgraph @IFACE@ 26,146 ff2bd6 ff2bd6 -t}${color}
]]
