# Neon-Grid kitty config
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never

cursor_shape            beam
cursor_blink_interval   0.6
cursor_trail            3
scrollback_lines        10000

# scrollbar: shown whenever there is something to scroll back to; drag or click it
scrollbar                 always
scrollbar_width           0.9
scrollbar_hover_width     1.1
scrollbar_handle_opacity  0.75
scrollbar_track_opacity   0.12
scrollbar_track_hover_opacity 0.25
scrollbar_hitbox_expansion 0.4
scrollbar_radius          0.4
scrollbar_min_handle_height 2
scrollbar_handle_color    #00f0ff
scrollbar_track_color     #7a86a8
enable_audio_bell       no
confirm_os_window_close 0

window_padding_width    12
background_opacity      0.86
dynamic_background_opacity yes
hide_window_decorations no
remember_window_size    no
initial_window_width    110c
initial_window_height   30c

tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #080a14
active_tab_background   #00f0ff
active_tab_font_style   bold
inactive_tab_foreground #7a86a8
inactive_tab_background #12162a
tab_bar_background      #080a14

active_border_color     #00f0ff
inactive_border_color   #2a2f4a
window_border_width     1px

# Neon-Grid palette
foreground              #d6f6ff
background              #080a14
selection_foreground    #080a14
selection_background    #00f0ff
cursor                  #ff2bd6
cursor_text_color       #080a14
url_color               #00f0ff

color0  #12162a
color8  #3b4266
color1  #ff3b6b
color9  #ff6b8f
color2  #29ffa3
color10 #7dffc6
color3  #f9f871
color11 #fffca8
color4  #3d8bff
color12 #7fb2ff
color5  #ff2bd6
color13 #ff7ae6
color6  #00f0ff
color14 #8af8ff
color7  #c3c7d1
color15 #ffffff

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# wallpaper colours written by neon-palette (empty = the colours above)
include neon-palette.conf
